[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapler"
version = "0.2.0"
description = "A 4-tier intelligent web scraping, recursive crawling, and hybrid vector retrieval engine"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Pavlo", email = "guns96x@github.com" }
]
dependencies = [
    "curl_cffi>=0.7.4",
    "scrapling[all]>=0.3.10",
    "patchright>=1.49.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "duckduckgo-search>=8.0.0",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.4.3"
]

[project.scripts]
scrapler = "scrapler.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scrapler*"]
